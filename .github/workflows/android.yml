name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APPLOCK_KEYSTORE_BASE64: ${{ secrets.APPLOCK_KEYSTORE_BASE64 }}
      APPLOCK_KEYSTORE_PASSWORD: ${{ secrets.APPLOCK_KEYSTORE_PASSWORD }}
      APPLOCK_KEY_ALIAS: ${{ secrets.APPLOCK_KEY_ALIAS }}
      APPLOCK_KEY_PASSWORD: ${{ secrets.APPLOCK_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Give permission to executable
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.1

      - name: Decode signing keystore
        if: env.APPLOCK_KEYSTORE_BASE64 != ''
        run: |
          echo "$APPLOCK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "APPLOCK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build with gradle
        run: ./gradlew clean assemble

      - name: Upload debug apks
        uses: actions/upload-artifact@v4.6.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug

      - name: Upload release apks
        uses: actions/upload-artifact@v4.6.2
        with:
          name: app-release
          path: app/build/outputs/apk/release
